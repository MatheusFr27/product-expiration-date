<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validade do Produto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <div class="header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="4" y="5.5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 3.5V7M16 3.5V7M4 9.5H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>

      <h1 id="page-title">Validade do Produto</h1>
      <p class="subtitle">
        Informe a data base e o período de validade para calcular a<br class="desktop-break">
        data final.
      </p>

      <form id="validity-form" novalidate>
        <div class="field-group">
          <label for="base-date">Data base</label>

          <div class="date-row">
            <div class="input-wrap">
              <input id="base-date" type="date" aria-describedby="date-hint">
              <svg class="input-icon calendar-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="4" y="5.5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
                <path d="M8 3.5V7M16 3.5V7M4 9.5H20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </div>

            <button
              id="today-toggle"
              class="today-toggle is-active"
              type="button"
              aria-pressed="true"
              aria-label="Usar a data de hoje como base"
              title="Usar a data de hoje"
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6.5 12.5L10.2 16L17.5 8.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <p id="date-hint" class="hint">A data de hoje está sendo usada como base.</p>
        </div>

        <div class="field-group validity-group">
          <label for="validity-value">Período de validação</label>

          <div class="validity-row">
            <input
              id="validity-value"
              class="number-input"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              placeholder="Ex: 30"
              aria-label="Número de validade"
            >

            <div class="select-wrap">
              <select id="validity-unit" aria-label="Unidade do período de validade">
                <option value="days">Dias</option>
                <option value="months">Meses</option>
                <option value="years">Anos</option>
              </select>
              <svg class="select-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M7 9.5L12 14.5L17 9.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>

        <section class="result-card" aria-live="polite" aria-label="Data de validade calculada">
          <span class="result-label">DATA DE VALIDADE</span>
          <strong id="result-date" class="result-date">—</strong>
        </section>
      </form>
    </section>

    <footer class="page-footer" aria-label="Informações do sistema">
      <span>V 0.0.1</span>
      <span>Desenvolvido por Matheus E. França</span>
    </footer>

    <style>
      /* Ajustes do rodapé e responsividade, mantendo os demais arquivos intactos. */
      .page {
        position: relative;
        padding-bottom: 76px;
      }

      .page-footer {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        color: #71809a;
        font-size: 11px;
        line-height: 1.4;
        font-weight: 400;
      }

      .page-footer span {
        white-space: nowrap;
      }

      @media (max-width: 560px) {
        .page {
          min-height: 100vh;
          padding: 24px 14px 72px;
          align-items: flex-start;
        }

        .page-footer {
          left: 14px;
          right: 14px;
          bottom: 16px;
          gap: 12px;
          font-size: 10px;
        }

        .page-footer span:last-child {
          text-align: right;
        }
      }

      @media (max-width: 360px) {
        .page-footer {
          font-size: 9px;
        }
      }
    </style>
  </main>

  <script src="script.js"></script>
</body>
</html>
